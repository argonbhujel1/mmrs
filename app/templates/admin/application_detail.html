{% extends "admin/base_admin.html" %}
{% block title %}Edit Application #{{ item.id }}{% endblock %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
  <h1>Edit Application #{{ item.id }}</h1>
  <div>
    <a href="{{ url_for('admin.applications') }}" class="btn" style="background:rgba(255,255,255,0.1);color:#fff;margin-right:8px;">← Back</a>
    <form method="POST" action="{{ url_for('admin.application_delete', id=item.id) }}" style="display:inline;" onsubmit="return confirm('Delete this application permanently?');">
      <button type="submit" class="btn" style="background:#7f1d1d;color:#fecaca;">Delete</button>
    </form>
  </div>
</div>
<div class="admin-card">
  <form method="POST" action="{{ url_for('admin.application_detail', id=item.id) }}" enctype="multipart/form-data">
    <div class="form-group"><label>Student Name *</label><input type="text" name="student_name" value="{{ item.student_name or '' }}" required></div>
    <div class="form-group"><label>Date of Birth</label><input type="date" name="date_of_birth" value="{{ item.date_of_birth.strftime('%Y-%m-%d') if item.date_of_birth else '' }}"></div>
    <div class="form-group"><label>Gender</label>
      <select name="gender">
        <option value="">Select</option>
        {% for g in ['Male','Female','Other'] %}
        <option value="{{ g }}" {% if item.gender==g %}selected{% endif %}>{{ g }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Parent/Guardian Name</label><input type="text" name="parent_name" value="{{ item.parent_name or '' }}"></div>
    <div class="form-group"><label>Phone</label><input type="text" name="phone" value="{{ item.phone or '' }}"></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ item.email or '' }}"></div>
    <div class="form-group"><label>Address</label><textarea name="address" rows="2">{{ item.address or '' }}</textarea></div>
    <div class="form-group"><label>Previous School</label><input type="text" name="previous_school" value="{{ item.previous_school or '' }}"></div>
    <div class="form-group"><label>Applying For</label><input type="text" name="applying_for" value="{{ item.applying_for or '' }}"></div>
    <div class="form-group"><label>Grade / Program</label><input type="text" name="grade_program" value="{{ item.grade_program or '' }}"></div>
    <div class="form-group"><label>Academic Info</label><textarea name="academic_info" rows="2">{{ item.academic_info or '' }}</textarea></div>
    <div class="form-group"><label>Message</label><textarea name="message" rows="2">{{ item.message or '' }}</textarea></div>
    <div class="form-group"><label>Status</label>
      <select name="status">
        {% for s in ['Pending','Reviewed','Accepted','Rejected'] %}
        <option value="{{ s }}" {% if item.status==s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Admin Notes</label><textarea name="admin_notes" rows="2">{{ item.admin_notes or '' }}</textarea></div>
    <div class="form-group"><label>Photo</label><input type="file" name="photo" accept="image/*">
      {% if item.photo %}<p style="font-size:0.85rem;margin-top:4px;"><a href="{{ url_for('static', filename=item.photo) }}" target="_blank">View current photo</a></p>{% endif %}
    </div>
    <div class="form-group"><label>Documents</label><input type="file" name="documents">
      {% if item.documents %}<p style="font-size:0.85rem;margin-top:4px;"><a href="{{ url_for('static', filename=item.documents) }}" target="_blank">Download current file</a></p>{% endif %}
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top:12px;padding:14px 28px;font-size:1rem;">💾 Save / Update Application</button>
  </form>
</div>
{% endblock %}
