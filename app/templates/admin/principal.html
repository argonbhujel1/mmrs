{% extends "admin/base_admin.html" %}
{% block title %}Principal{% endblock %}
{% block content %}
<h1 style="color:var(--navy);margin-bottom:24px;">Principal Message</h1>
<div class="admin-card">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group"><label>Name</label><input type="text" name="name" value="{{ principal.name or '' }}"></div>
    <div class="form-group"><label>Designation</label><input type="text" name="designation" value="{{ principal.designation or '' }}"></div>
    <div class="form-group"><label>Title</label><input type="text" name="title" value="{{ principal.title or '' }}"></div>
    <div class="form-group"><label>Message</label><textarea name="message" rows="8">{{ principal.message or '' }}</textarea></div>
    <div class="form-group"><label>Photo</label><input type="file" name="photo" accept="image/*"></div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
