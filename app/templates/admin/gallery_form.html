{% extends "admin/base_admin.html" %}
{% block title %}Add Gallery Image{% endblock %}
{% block content %}
<h1 style="color:var(--navy);margin-bottom:24px;">Add Gallery Image</h1>
<div class="admin-card">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group"><label>Title</label><input type="text" name="title"></div>
    <div class="form-group"><label>Category</label>
      <select name="category">
        {% for c in ['Campus','Students','Classrooms','Sports','Events','Cultural','Tours','Labs'] %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Description</label><textarea name="description" rows="2"></textarea></div>
    <div class="form-group"><label>Image *</label><input type="file" name="image" accept="image/*" required></div>
    <div class="form-group"><label><input type="checkbox" name="is_active" checked> Active</label></div>
    <button type="submit" class="btn btn-primary">Upload</button>
  </form>
</div>
{% endblock %}
