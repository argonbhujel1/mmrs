{% extends "admin/base_admin.html" %}
{% block title %}Contact Info{% endblock %}
{% block content %}
<h1 style="color:var(--navy);margin-bottom:24px;">Contact Information</h1>
<div class="admin-card">
  <form method="POST">
    <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ info.address or '' }}"></div>
    <div class="form-group"><label>Phone</label><input type="text" name="phone" value="{{ info.phone or '' }}"></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ info.email or '' }}"></div>
    <div class="form-group"><label>Website</label><input type="text" name="website" value="{{ info.website or '' }}"></div>
    <div class="form-group"><label>Facebook URL</label><input type="url" name="facebook" value="{{ info.facebook or '' }}"></div>
    <div class="form-group"><label>Instagram URL</label><input type="url" name="instagram" value="{{ info.instagram or '' }}"></div>
    <div class="form-group"><label>YouTube URL</label><input type="url" name="youtube" value="{{ info.youtube or '' }}"></div>
    <div class="form-group"><label>Google Map Embed URL</label><textarea name="map_embed" rows="2">{{ info.map_embed or '' }}</textarea></div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
