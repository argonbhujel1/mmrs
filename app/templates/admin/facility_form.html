{% extends "admin/base_admin.html" %}
{% block title %}Facility Form{% endblock %}
{% block content %}
<h1 style="color:var(--navy);margin-bottom:24px;">{{ 'Edit' if item else 'Add' }} Facility</h1>
<div class="admin-card">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group"><label>Name *</label><input type="text" name="name" value="{{ item.name if item else '' }}" required></div>
    <div class="form-group"><label>Description</label><textarea name="description" rows="3">{{ item.description if item else '' }}</textarea></div>
    <div class="form-group"><label>Icon</label><input type="text" name="icon" value="{{ item.icon if item else '' }}" placeholder="e.g. computer"></div>
    <div class="form-group"><label>Order</label><input type="number" name="order" value="{{ item.order if item else 0 }}"></div>
    <div class="form-group"><label><input type="checkbox" name="is_active" {% if not item or item.is_active %}checked{% endif %}> Active</label></div>
    <div class="form-group"><label>Image</label><input type="file" name="image" accept="image/*"></div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
