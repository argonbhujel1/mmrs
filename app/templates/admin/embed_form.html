{% extends "admin/base_admin.html" %}
{% block title %}Embed Form{% endblock %}
{% block content %}
<h1 style="margin-bottom:24px;">{{ 'Edit' if item else 'Add' }} HTML Embed / Images</h1>
<div class="admin-card">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group"><label>Page</label>
      <select name="page">
        {% for p in ['home','about','gallery','programs','contact'] %}
        <option value="{{ p }}" {% if item and item.page==p %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Title</label><input type="text" name="title" value="{{ item.title if item else '' }}"></div>
    <div class="form-group"><label>HTML Embed (YouTube, Google Map, iframe, any HTML)</label>
      <textarea name="embed_html" rows="6" placeholder='&lt;iframe src="https://www.youtube.com/embed/..." ...&gt;&lt;/iframe&gt;'>{{ item.embed_html if item else '' }}</textarea>
    </div>
    <div class="form-group"><label>Add Images (multiple – hold Ctrl/Cmd to select many)</label>
      <input type="file" name="images" accept="image/*" multiple>
      {% if item and item.images %}
      <p style="margin-top:8px;font-size:0.85rem;opacity:0.8;">Existing images stored. New uploads will be appended.</p>
      {% endif %}
    </div>
    <div class="form-group"><label>Order</label><input type="number" name="order" value="{{ item.order if item else 0 }}"></div>
    <div class="form-group"><label><input type="checkbox" name="is_active" {% if not item or item.is_active %}checked{% endif %}> Active</label></div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
