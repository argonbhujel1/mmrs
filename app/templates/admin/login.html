<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Morang Model</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--navy-dark); }
    .login-box { background:white; padding:40px; border-radius:16px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .login-box h1 { font-size:1.4rem; color:var(--navy); margin-bottom:8px; }
    .login-box p { color:var(--text-muted); font-size:0.9rem; margin-bottom:24px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Admin Login</h1>
    <p>Morang Model College & School CMS</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="flash {{ category }}" style="margin-bottom:16px;">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group"><label>Username</label><input type="text" name="username" required autofocus></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>
  </div>
</body>
</html>
