{% extends "admin/base_admin.html" %}
{% block title %}Student Form{% endblock %}
{% block content %}
<h1 style="color:var(--navy);margin-bottom:24px;">{{ 'Edit' if item else 'Add' }} Student</h1>
<div class="admin-card">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group"><label>Student ID / Roll No</label><input type="text" name="student_id" value="{{ item.student_id if item else '' }}" placeholder="Used for login"></div>
    <div class="form-group"><label>Full Name *</label><input type="text" name="name" value="{{ item.name if item else '' }}" required></div>
    <div class="form-group"><label>Class / Grade *</label><input type="text" name="class_grade" value="{{ item.class_grade if item else '' }}" placeholder="e.g. Grade 10, +2 Science" required></div>
    <div class="form-group"><label>Section</label><input type="text" name="section" value="{{ item.section if item else '' }}"></div>
    <div class="form-group"><label>Parent/Guardian Name</label><input type="text" name="parent_name" value="{{ item.parent_name if item else '' }}"></div>
    <div class="form-group"><label>Parent Contact Number *</label><input type="text" name="parent_phone" value="{{ item.parent_phone if item else '' }}" required placeholder="Used for public profile lookup"></div>
    <div class="form-group"><label>Student Phone</label><input type="text" name="phone" value="{{ item.phone if item else '' }}"></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ item.email if item else '' }}" placeholder="Can also be used for login"></div>
    <div class="form-group"><label>Address</label><textarea name="address" rows="2">{{ item.address if item else '' }}</textarea></div>
    <div class="form-group"><label>Date of Birth</label><input type="date" name="date_of_birth" value="{{ item.date_of_birth.strftime('%Y-%m-%d') if item and item.date_of_birth else '' }}"></div>
    <div class="form-group"><label>Gender</label>
      <select name="gender">
        <option value="">Select</option>
        {% for g in ['Male','Female','Other'] %}
        <option value="{{ g }}" {% if item and item.gender==g %}selected{% endif %}>{{ g }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Login Password {% if item %}(leave blank to keep current){% endif %}</label><input type="password" name="password" {% if not item %}required{% endif %}></div>
    <div class="form-group"><label>Photo</label><input type="file" name="photo" accept="image/*"></div>
    <div class="form-group"><label>Documents (any format: PDF, DOC, ZIP, image…)</label><input type="file" name="documents"></div>
    <div class="form-group"><label><input type="checkbox" name="is_active" {% if not item or item.is_active %}checked{% endif %}> Active (can login)</label></div>
    <button type="submit" class="btn btn-primary">Save Student</button>
  </form>
</div>
{% endblock %}
