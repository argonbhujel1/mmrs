{% extends "admin/base_admin.html" %}
{% block title %}Teacher Form{% endblock %}
{% block content %}
<h1 style="color:var(--navy);margin-bottom:24px;">{{ 'Edit' if item else 'Add' }} Teacher</h1>
<div class="admin-card">
  <form method="POST" enctype="multipart/form-data">
    <div class="form-group"><label>Teacher ID</label><input type="text" name="teacher_id" value="{{ item.teacher_id if item else '' }}" placeholder="Used for login"></div>
    <div class="form-group"><label>Full Name *</label><input type="text" name="name" value="{{ item.name if item else '' }}" required></div>
    <div class="form-group"><label>Designation</label><input type="text" name="designation" value="{{ item.designation if item else '' }}"></div>
    <div class="form-group"><label>Department</label><input type="text" name="department" value="{{ item.department if item else '' }}"></div>
    <div class="form-group"><label>Phone</label><input type="text" name="phone" value="{{ item.phone if item else '' }}"></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ item.email if item else '' }}"></div>
    <div class="form-group"><label>Bio</label><textarea name="bio" rows="3">{{ item.bio if item else '' }}</textarea></div>
    <div class="form-group"><label>Order</label><input type="number" name="order" value="{{ item.order if item else 0 }}"></div>
    <div class="form-group"><label>Login Password {% if item %}(leave blank to keep){% endif %}</label><input type="password" name="password" {% if not item %}required{% endif %}></div>
    <div class="form-group"><label>Photo</label><input type="file" name="photo" accept="image/*"></div>
    <div class="form-group"><label>Documents (any format)</label><input type="file" name="documents"></div>
    <div class="form-group"><label><input type="checkbox" name="is_active" {% if not item or item.is_active %}checked{% endif %}> Active</label></div>
    <button type="submit" class="btn btn-primary">Save Teacher</button>
  </form>
</div>
{% endblock %}
