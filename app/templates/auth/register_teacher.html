{% extends "base.html" %}
{% block title %}Teacher Register | Morang Model{% endblock %}
{% block content %}
<section class="section" style="padding-top:40px;">
  <div class="container" style="max-width:480px;">
    <div class="section-header">
      <div class="section-label">TEACHER</div>
      <h2 class="section-title">Teacher Registration</h2>
      <p class="section-desc">Match existing admin record to claim, or submit new request for approval.</p>
    </div>
    <div class="contact-form glass-card">
      <form method="POST">
        <div class="form-group"><label>Teacher ID</label><input type="text" name="teacher_id"></div>
        <div class="form-group"><label>Full Name *</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email"></div>
        <div class="form-group"><label>Phone</label><input type="text" name="phone"></div>
        <div class="form-group"><label>Designation</label><input type="text" name="designation"></div>
        <div class="form-group"><label>Department</label><input type="text" name="department"></div>
        <div class="form-group"><label>Password *</label><input type="password" name="password" required minlength="4"></div>
        <div class="form-group"><label>Confirm Password *</label><input type="password" name="password2" required minlength="4"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Register as Teacher</button>
      </form>
      <p style="margin-top:16px;text-align:center;font-size:0.9rem;">
        <a href="{{ url_for('auth.login_teacher') }}" style="color:var(--navy);">Already registered? Login</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
