{% extends "base.html" %}
{% block title %}Student Login | Morang Model{% endblock %}
{% block content %}
<section class="section" style="padding-top:40px;">
  <div class="container" style="max-width:420px;">
    <div class="section-header">
      <div class="section-label">STUDENT</div>
      <h2 class="section-title">Student Login</h2>
      <p class="section-desc">Only students registered by the school admin can login.</p>
    </div>
    <div class="contact-form glass-card">
      <form method="POST">
        <div class="form-group"><label>Student ID or Email</label><input type="text" name="student_id" required autofocus></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
      </form>
      <p style="margin-top:16px;text-align:center;font-size:0.9rem;">
        <p style="margin-top:12px;text-align:center;font-size:0.9rem;"><a href="{{ url_for('auth.register_student') }}" style="color:var(--navy);">New user? Register</a></p>
<a href="{{ url_for('auth.login_choice') }}" style="color:var(--navy);">← Back to login options</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
